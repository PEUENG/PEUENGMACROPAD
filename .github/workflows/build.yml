
name: Build MacroPad

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar para Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onedir --name MacroPad --collect-all serial --collect-all pyautogui macro_pad.py

      - name: Compilar para macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MacroPad --collect-all serial --collect-all pyautogui macro_pad.py

      - name: Compactar versão Windows
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/MacroPad -DestinationPath MacroPad-Windows.zip

      - name: Compactar versão macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MacroPad.app MacroPad-macOS.zip

      - name: Publicar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: MacroPad-${{ matrix.platform }}
          path: MacroPad-${{ matrix.platform }}.zip
          if-no-files-found: error
